
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeenASR Reading Pod</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 32px auto;
      padding: 0 18px;
      line-height: 1.6;
    }
    button {
      padding: 10px 16px;
      margin: 4px;
      cursor: pointer;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .passage {
      white-space: pre-wrap;
      padding: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 20px;
      line-height: 1.9;
    }
    .checkpoint {
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .log {
      background: #f5f5f5;
      padding: 12px;
      min-height: 60px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    #error {
      color: #b00020;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="app">Loading reading app...</div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
